<!doctype html>
<!--
  SOUNDFRAME Play Store screenshot designer.
  Render one slide per URL hash, e.g. template.html#en-US/3, at exactly 1080 × 1920.
  See render.sh for the batch command.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Instrument Serif"; src: url("fonts/instrument-serif.ttf"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("fonts/instrument-serif-italic.ttf"); }
  @font-face { font-family: "Manrope"; src: url("fonts/manrope.ttf"); font-weight: 200 800; }

  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    background: #050508;
    font-family: "Manrope", sans-serif;
    color: #f5f3fa;
    -webkit-font-smoothing: antialiased;
  }
  /* Atmosphere: two coloured light fields and the slide's artwork, blurred far behind. */
  .glow { position: absolute; border-radius: 50%; filter: blur(140px); opacity: .55; }
  .glow.a { width: 900px; height: 900px; left: -320px; top: -260px; background: var(--a); opacity: .38; }
  .glow.b { width: 980px; height: 980px; right: -380px; bottom: 120px; background: var(--b); opacity: .42; }
  .art {
    position: absolute; left: 50%; top: 1150px; width: 1500px; height: 1500px;
    transform: translate(-50%, -50%); border-radius: 50%;
    background-size: cover; background-position: center;
    filter: blur(6px) saturate(1.2); opacity: .32;
    -webkit-mask-image: radial-gradient(circle, #000 35%, transparent 70%);
  }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 35%, transparent 40%, rgba(0,0,0,.55) 100%); }

  header { position: absolute; top: 86px; left: 0; right: 0; text-align: center; }
  .mark { display: inline-flex; align-items: center; gap: 14px; font-weight: 800; font-size: 24px; letter-spacing: .42em; padding-left: .42em; }
  .mark i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #6cf5d2, #5b7cfa, #ff6ac8); }

  h1 {
    position: absolute; top: 158px; left: 70px; right: 70px; margin: 0;
    font: 400 104px/1.0 "Instrument Serif", serif; letter-spacing: -.012em;
    text-align: center; text-wrap: balance;
  }
  h1 em {
    font-style: italic;
    background: linear-gradient(100deg, var(--a), var(--b));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 .06em;
  }
  p.sub {
    position: absolute; top: var(--subTop, 392px); left: 120px; right: 120px; margin: 0;
    font-size: 36px; line-height: 1.38; font-weight: 500; color: #b9b5c9;
    text-align: center; text-wrap: balance;
  }

  /* Device: thin luminous rim, deep bezel, punch-hole camera; bleeds off the bottom edge. */
  .device {
    position: absolute; left: 50%; top: var(--deviceTop, 600px); transform: translateX(-50%);
    width: 700px; padding: 16px; border-radius: 92px;
    background: linear-gradient(160deg, #23232e, #0b0b11 40%, #15151d);
    box-shadow:
      0 0 0 2px rgba(255,255,255,.10),
      0 0 0 3px rgba(0,0,0,.6),
      0 70px 160px -10px var(--shadow),
      0 30px 60px rgba(0,0,0,.6);
  }
  .device::before { /* specular rim */
    content: ""; position: absolute; inset: 0; border-radius: 92px; pointer-events: none;
    background: linear-gradient(150deg, rgba(255,255,255,.28), transparent 22%, transparent 78%, rgba(255,255,255,.10));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    padding: 2px;
  }
  .screen { position: relative; border-radius: 76px; overflow: hidden; background: #000; }
  .screen img { display: block; width: 100%; }

  /* Optional feature chips under the subtitle. */
  .chips { position: absolute; top: var(--chipsTop, 520px); left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
  .chip {
    font-size: 25px; font-weight: 700; letter-spacing: .02em; padding: 12px 24px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.16); color: #f5f3fa;
  }
</style>
</head>
<body>
  <div class="glow a"></div><div class="glow b"></div>
  <div class="art" id="art"></div>
  <div class="vignette"></div>
  <header><span class="mark"><i></i>SOUNDFRAME</span></header>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="chips" id="chips"></div>
  <div class="device"><div class="screen"><img id="shot" alt=""></div></div>

<script>
// Slide definitions. `title` may contain <em>…</em> for the gradient accent; copy is checked
// against the real feature set (5 styles, 7 palettes, 2048 px PNG, 1080×1920 video, on-device only).
const SLIDES = [
  { shot: "01-onboarding", a: "#6cf5d2", b: "#a35cff", art: "aura",
    en: { title: "Every sound has a <em>shape</em>", sub: "Turn your voice, music and the world around you into generative art." },
    es: { title: "Cada sonido tiene una <em>forma</em>", sub: "Convierte tu voz, tu música y el mundo que te rodea en arte generativo." } },
  { shot: "02-studio", a: "#ffb54c", b: "#ff6ac8", art: "bloom-violet",
    en: { title: "Capture any sound in <em>10 seconds</em>", sub: "A laugh, the rain, a heartbeat, a song. Just tap and listen." },
    es: { title: "Captura cualquier sonido en <em>10 segundos</em>", sub: "Una risa, la lluvia, un latido, una canción. Solo toca y escucha." } },
  { shot: "03-recording", a: "#ff6ac8", b: "#a35cff", art: "echo",
    en: { title: "Your sound, <em>alive</em>", sub: "Every vibration reacts in real time while you record." },
    es: { title: "Tu sonido, <em>vivo</em>", sub: "Cada vibración reacciona en tiempo real mientras grabas." } },
  { shot: "04-editor", a: "#ffb54c", b: "#e5305c", art: "echo",
    en: { title: "Real audio analysis, <em>real art</em>", sub: "Rhythm, pitch and texture sculpt every single artwork." },
    es: { title: "Análisis de audio real, <em>arte real</em>", sub: "El ritmo, el tono y la textura esculpen cada obra." } },
  { shot: "05-palettes", a: "#ffe6a3", b: "#ff6b3d", art: "bloom",
    en: { title: "Make it <em>yours</em>", sub: "Endless variations of the same sound.", chips: ["5 styles", "7 palettes", "∞ variations"] },
    es: { title: "Hazlo <em>tuyo</em>", sub: "Variaciones infinitas del mismo sonido.", chips: ["5 estilos", "7 paletas", "∞ variaciones"] } },
  { shot: "06-export", a: "#35c9f2", b: "#a35cff", art: "bloom",
    en: { title: "Share it in <em>HD</em>", sub: "Images up to 2048 px and 1080×1920 videos with your original sound." },
    es: { title: "Compártelo en <em>HD</em>", sub: "Imágenes de hasta 2048 px y vídeos 1080×1920 con tu sonido original." } },
  { shot: "07-gallery", a: "#6cf5d2", b: "#5b7cfa", art: "bloom-violet",
    en: { title: "Private by <em>design</em>", sub: "Your gallery stays on your phone.", chips: ["100% on-device", "No account", "No ads"] },
    es: { title: "Privada por <em>diseño</em>", sub: "Tu galería se queda en tu móvil.", chips: ["100 % en el móvil", "Sin cuenta", "Sin anuncios"] } },
];

const [locale, index] = decodeURIComponent(location.hash.slice(1)).split("/");
const slide = SLIDES[Number(index) - 1];
const copy = slide[locale.slice(0, 2)];
const root = document.documentElement.style;
root.setProperty("--a", slide.a);
root.setProperty("--b", slide.b);
root.setProperty("--shadow", slide.b + "73");
document.getElementById("art").style.backgroundImage = `url(art/${slide.art}.png)`;
document.getElementById("title").innerHTML = copy.title;
document.getElementById("sub").textContent = copy.sub;
document.getElementById("shot").src = `../screenshots/raw/${locale}/${slide.shot}.png`;

// Flow the layout from the measured headline so 1- and 2-line titles both sit well.
document.fonts.ready.then(() => {
  const titleBottom = document.getElementById("title").getBoundingClientRect().bottom;
  const subTop = titleBottom + 28;
  root.setProperty("--subTop", subTop + "px");
  const subBottom = subTop + document.getElementById("sub").getBoundingClientRect().height;
  let next = subBottom + 34;
  if (copy.chips) {
    document.getElementById("chips").innerHTML = copy.chips.map(c => `<span class="chip">${c}</span>`).join("");
    root.setProperty("--chipsTop", next + "px");
    next += 70;
  }
  root.setProperty("--deviceTop", (next + 30) + "px");
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
